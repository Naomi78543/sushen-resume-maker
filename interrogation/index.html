<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="在浏览器本地完成经历深挖、Claim Ledger、JD Matrix 与面试防御。">
  <title>酥神简历深度拷打台</title>
  <link rel="stylesheet" href="styles.css?v=20260825-evidence-pipeline">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">酥</span>
      <div>
        <h1>酥神简历工作台</h1>
        <p>先挖出竞争力，再写一页简历</p>
      </div>
    </div>
    <nav class="product-nav" aria-label="工作台功能">
      <a class="is-active" href="./">深度拷打</a>
      <a href="../transform/">一键酥神化</a>
      <a href="../editor/">简历编辑器</a>
    </nav>
    <div class="privacy-badge" title="数据只保存在当前浏览器中">
      <span class="privacy-dot"></span>
      本地处理 · 不上传服务器
    </div>
  </header>

  <main class="app-shell">
    <aside class="step-rail" aria-label="拷打流程">
      <div class="rail-intro">
        <span class="eyebrow">ABILITY MINING FIRST</span>
        <h2>深度拷打流程</h2>
        <p>每轮只问 1–3 个高价值问题，重点挖出原简历没写出来的能力与成果。</p>
      </div>
      <ol id="stepList" class="step-list">
        <li><button type="button" data-step="ledger"><span>01</span><b>Claim Ledger</b><small>拆成可追溯事实</small></button></li>
        <li><button type="button" data-step="roleAudit"><span>02</span><b>语义角色校验</b><small>动作、范围、归因、时态</small></button></li>
        <li><button type="button" data-step="questions"><span>03</span><b>针对性拷打</b><small>只追问高价值缺口</small></button></li>
        <li><button type="button" data-step="rewrite"><span>04</span><b>项目级重写</b><small>背景、职责、数据</small></button></li>
        <li><button type="button" data-step="compression"><span>05</span><b>A4 内容压缩</b><small>评分、去重、容量门禁</small></button></li>
      </ol>
      <div class="rail-summary">
        <div><strong id="claimCount">0</strong><span>亮点素材</span></div>
        <div><strong id="answerCount">0</strong><span>已回答</span></div>
        <div><strong id="coverageValue">0%</strong><span>证据覆盖</span></div>
      </div>
      <button id="clearButton" class="text-button danger" type="button">清除本地拷打记录</button>
    </aside>

    <section class="content-shell">
      <div id="contentHeader" class="content-header"></div>
      <div id="contentPanel" class="content-panel"></div>
    </section>
  </main>

  <template id="intakeTemplate">
    <section class="hero-card">
        <span class="eyebrow">DISCOVER YOUR VALUE</span>
      <h2>简历写了“做过什么”，深挖要找出“你因此证明了什么能力”</h2>
      <p>输入目标 JD 和重点经历。系统会沿着业务难度、主动判断、分析方法、资源推动、流程沉淀与实际影响逐轮追问，把原简历遗漏的竞争力补出来。</p>
      <div class="guardrails">
        <span>发现隐性能力</span>
        <span>补全方法与复杂度</span>
        <span>寻找可复用成果</span>
        <span>最后再校对事实边界</span>
      </div>
    </section>
  </template>

  <input id="materialFile" type="file" accept=".txt,.md,.json,.pdf,application/json,application/pdf,text/plain,text/markdown,image/png,image/jpeg,image/webp,image/bmp" multiple hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=20260825-evidence-pipeline" defer></script>
</body>
</html>
